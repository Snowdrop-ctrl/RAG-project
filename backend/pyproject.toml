[project]
name = "rag-backend"
version = "0.1.0"
description = "FastAPI backend for the RAG project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28.1",
    "fastembed>=0.8.1",
    "chromadb>=1.5.9",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "reportlab>=5.0.1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
